[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# test/archive/ 是过时测试脚本的只读归档，test/probes/ 是一次性探针，都不参与收集
# （这两个目录只留本地、不上传仓，见 .gitignore）
# test/eval/ 是离线评估脚本，不匹配 python_files = test_*.py，同样不会被收集
norecursedirs = archive probes eval .* build dist node_modules venv __pycache__
markers =
    slow: 需要真实 Milvus / Ollama / MiniMax —— 慢，且可能花钱
    e2e: 浏览器端到端（Playwright 驱动 Streamlit）
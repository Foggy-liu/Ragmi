# configs/agent_config.yaml —— v2.2 Agent 节点计数上限 + 超时预算
# 加载方：agent/constants.py
agent:
  iter:
    max_per_cycle: 3       # iter 节点单 cycle 上限；reflect 触发 re_iterate/rewrite 时重置
  reflect:
    max_absolute: 3        # reflect 节点绝对上限；永不重置，超限强制 end
  timeout:
    llm: 30                # 单次 LLM 调用超时（秒）—— 传给 ChatOpenAI(timeout=)
    tool: 30               # 单次工具调用超时（秒）—— Timer 计时器
    total: 90              # 整个思考过程总时限（秒）—— 写进 state["deadline"]
# 注：原 synth.max_per_cycle（MAX_SYNTH）已删除——综合节点的上限职责
# 已转移给 reflect 的 MAX_REFL（初稿 + 最多 3 次重写 = 综合最多跑 4 次）

DEFAULT_MODEL:
  platform: "minimax"    # 默认平台：minimax
  model_name: "MiniMax-M3.1-Flash"  # MiniMax 默认模型（M3.1-Flash 版本）

DEFAULT_EMBEDDING_MODEL:
  platform: "ollama"
  # ⚠️ 2026-11-25 从 bge-large:latest 换成 bge-m3:latest。
  # bge-large 是 BGE 的**英文**模型，在中文语料上几乎不区分度 —— 实测「学习计划的四个阶段」
  # 的正确块会被法典块挤出 top-5，「民法典诉讼时效期间」返回的全是民法典别的条文。
  # bge-m3 是多语言模型，同样 1024 维，实测把最相关的三块稳定排在 1/2/3。
  # ⚠️ 改这里会**同时**改索引端和检索端（两端都从这一个字段取值），不能只改一边。
  model_name: "bge-m3:latest"

# 平台配置（ollama + aliyun + minimax—使用的openai）
PLATFORMS:
  - platform_name: "ollama"
    # ⚠️ 别再硬编码 127.0.0.1：容器里的 localhost 是容器自己 → embedding 连不上宿主机 Ollama。
    # 裸跑 = http://127.0.0.1:11434/v1 ；容器内 = http://host.docker.internal:11434/v1（compose 给）。
    api_base_url: "${OLLAMA_BASE_URL}"
    api_key: "EMPTY"          # ollama 无需密钥
    timeout: 60               # 超时时间
    concurrency: 5            # 并发数
  - platform_name: "aliyun"
    api_base_url: "${ALIYUN_BASE_URL}"
    api_key: "${ALIYUN_API_KEY}"  # 占位符，从.env读取
    timeout: 30
    concurrency: 3
  - platform_name: "openai"
    api_base_url: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"  # 占位符，从.env读取
    timeout: 30
    concurrency: 3
  - platform_name: "minimax"
    api_base_url: "${MINIMAX_BASE_URL}"
    api_key: "${MINIMAX_API_KEY}"  # MiniMax API密钥
    timeout: 60
    concurrency: 3

# 模型默认参数（支持不同平台的模型）
MODEL_DEFAULTS:
  # ollama 平台的模型参数
  ollama:
    deepseek-r1:1.5b:
      temperature: 0.9
      max_tokens: 4096
      history_len: 10
    qwen3-4b:latest:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15

    embedding:
      "bge-large:latest":
        dimensions: 1024
        context_size: 512
      "bge-m3:latest":
        dimensions: 1024
        context_size: 8192

  # openai 平台的模型参数
  openai:
    gpt-3.5-turbo:
      temperature: 0.7
      max_tokens: 4096
      history_len: 10
    gpt-4o-mini:
      temperature: 0.5
      max_tokens: 16384
      history_len: 20
  # 阿里云 平台的模型参数
  aliyun:
    qwen-plus-2025-07-28:
      temperature: 0.7
      max_tokens: 4096
      history_len: 10
    qwen3.5-plus:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15
  # MiniMax 平台的模型参数
  minimax:
    MiniMax-M3.1-Flash:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15
    MiniMax-M3:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15
    MiniMax-M2.7:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15
    MiniMax-M2.5:
      temperature: 0.7
      max_tokens: 8192
      history_len: 15

# 向量化配置（新增或修改这部分）
EMBEDDING_CONFIG:
  # 文本切分配置
  # ⚠️ 这一段是切分参数的**唯一事实来源** —— utils/txt_spliter/spliter.py 从这里读。
  # 以前代码写死 chunk_size=300、这里写 280，而这份 YAML 从没被读过 → 改配置不生效
  # （P1-7）。现在值对齐到实际一直在跑的值（300），改这里就能改行为。
  text_splitter:
    chunk_size: 300
    chunk_overlap: 30
    separators: ["\n\n", "\n", "。", "；", "，", " "]

  # 向量数据库配置（Milvus）
  vector_store:
    type: "milvus"
    milvus:
      host: "${MILVUS_HOST}"
      port: "${MILVUS_PORT}"
      collection_name: "txt_data"
      distance_metric: "cosine"
  
  # 批量处理配置
  batch_settings:
    batch_size: 100
    max_concurrency: 3
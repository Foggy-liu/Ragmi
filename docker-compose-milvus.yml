version: '3.8'

services:
  Milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: docker-milvus-standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED_STORAGE: "true"
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

volumes:
  milvus-data:
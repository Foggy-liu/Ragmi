services:
  milvus:
    image: milvusdb/milvus:standalone
    container_name: ragmi-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - ragmi-net

  api:
    # api 与 web 用同一个镜像（web 只换 command），避免 web 每次启动都 pip install 一遍
    image: ragmi-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragmi-api
    ports:
      - "8000:8000"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      LLM_ROOT: /app
      # ⚠️ 容器里的 127.0.0.1 是容器自己 → embedding 必须走宿主机 Ollama。
      # 末尾的 /v1 会被 EmbeddingModel._init_client 剥掉（embedding 走 Ollama 原生 /api/embed），
      # 而 ollama 平台的 chat 走 OpenAI 兼容端点，需要保留 /v1。
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    env_file:
      - .env
    volumes:
      - ./documents:/app/documents
      - ./txt:/app/txt
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - ragmi-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ragmi-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragmi-web
    working_dir: /app
    command: >
      streamlit run main_web.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    networks:
      - ragmi-net

volumes:
  milvus-data:

networks:
  ragmi-net:
    driver: bridge

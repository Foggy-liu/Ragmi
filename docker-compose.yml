version: "3.8"

services:
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: ragmi-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED_STORAGE: "true"
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    networks:
      - ragmi-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragmi-api
    ports:
      - "8000:8000"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      LLM_ROOT: /app
    env_file:
      - .env
    volumes:
      - ./documents:/app/documents
      - ./txt:/app/txt
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - ragmi-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: python:3.11-slim
    container_name: ragmi-web
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt streamlit &&
               streamlit run main_web.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    networks:
      - ragmi-net

volumes:
  milvus-data:

networks:
  ragmi-net:
    driver: bridge
